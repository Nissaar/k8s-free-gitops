# Secret monitoring/otel-credentials (env of the otel-gateway collector),
# filled from the OCI Vault secret "monitoring-otel-credentials":
#   {"GRAFANA_CLOUD_OTLP_ENDPOINT": "https://otlp-gateway-prod-<zone>.grafana.net/otlp",
#    "GRAFANA_CLOUD_INSTANCE_ID": "<number>",
#    "GRAFANA_CLOUD_TOKEN": "glc_...",
#    "NEW_RELIC_OTLP_ENDPOINT": "https://otlp.nr-data.net",
#    "NEW_RELIC_LICENSE_KEY": "...NRAL"}
# Grafana Cloud: grafana.com -> your stack -> OpenTelemetry -> Configure:
#   "OTLP endpoint" (ends in /otlp), "Instance ID", and a token made there
#   (scopes metrics:write, logs:write, traces:write).
# New Relic: one.newrelic.com -> API keys -> the INGEST - LICENSE key.
#   Endpoint https://otlp.nr-data.net (US account) or
#   https://otlp.eu01.nr-data.net (EU account).
# Put it in with  ~/oracle-always-free/scripts/put-secret.sh monitoring-otel-credentials <file.json>
# (docs/WHAT-YOU-DO.md step 21). The collector reads env at start: after a
# change, kubectl -n monitoring rollout restart deployment/otel-gateway
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: otel-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-vault
  target:
    name: otel-credentials
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: monitoring-otel-credentials
