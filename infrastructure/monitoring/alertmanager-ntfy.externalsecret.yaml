# Secret monitoring/alertmanager-ntfy, mounted into Alertmanager at
# /etc/alertmanager/secrets/alertmanager-ntfy/<key> (bearer token files).
# Filled from the OCI Vault secret "monitoring-alertmanager-ntfy":
#   {"NTFY_TOKEN": "tk_...", "CHATOPS_NTFY_TOKEN": "tk_..."}
# NTFY_TOKEN: the "bot" token of the public Home ntfy (ntfy.example.com,
#   ACL bot:*:wo; the standby in apps/ntfy-standby knows it too).
# CHATOPS_NTFY_TOKEN: the ChatOps ntfy token of user ops (same as the
#   restore test's NTFY_TOKEN).
# Put it in with  ~/oracle-always-free/scripts/put-secret.sh monitoring-alertmanager-ntfy <file.json>
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-ntfy
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-vault
  target:
    name: alertmanager-ntfy
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: monitoring-alertmanager-ntfy
