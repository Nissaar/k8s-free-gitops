# OpenTelemetry Collector (contrib) as a DaemonSet: reads every pod's log
# files on its node (/var/log/pods, chart preset logsCollection), adds the
# pod/namespace names (preset kubernetesAttributes) and sends them over OTLP
# to otel-gateway, which forwards them to Grafana Cloud and New Relic. No
# credentials here. Its own logs are excluded (no loop).
#
# Runs as root: /var/log/pods files are owned by root on the nodes. Read-only
# root filesystem, no capabilities, nothing else.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-logs
  namespace: monitoring
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  interval: 1h
  releaseName: otel-logs
  chart:
    spec:
      chart: opentelemetry-collector
      version: "0.x"
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: otel-logs
    mode: daemonset
    image:
      repository: docker.io/otel/opentelemetry-collector-contrib
    command:
      name: otelcol-contrib
    presets:
      logsCollection:
        enabled: true
      kubernetesAttributes:
        enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 192Mi
    nodeSelector:
      kubernetes.io/arch: arm64
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
    ports:
      otlp:
        enabled: false
      otlp-http:
        enabled: false
      jaeger-compact:
        enabled: false
      jaeger-thrift:
        enabled: false
      jaeger-grpc:
        enabled: false
      zipkin:
        enabled: false
    service:
      enabled: false
    # The presets add the file_log receiver and k8sattributes processor to
    # the "logs" pipeline below.
    alternateConfig:
      extensions:
        health_check:
          endpoint: ${env:MY_POD_IP}:13133
      processors:
        memory_limiter:
          check_interval: 5s
          limit_percentage: 80
          spike_limit_percentage: 25
        batch:
          send_batch_size: 1024
          timeout: 10s
      exporters:
        otlp/gateway:
          endpoint: otel-gateway.monitoring.svc.cluster.local:4317
          tls:
            insecure: true
      service:
        extensions: [health_check]
        telemetry:
          metrics:
            level: basic
            readers:
              - pull:
                  exporter:
                    prometheus:
                      host: ${env:MY_POD_IP}
                      port: 8888
        pipelines:
          logs:
            receivers: []
            processors: [memory_limiter, batch]
            exporters: [otlp/gateway]
