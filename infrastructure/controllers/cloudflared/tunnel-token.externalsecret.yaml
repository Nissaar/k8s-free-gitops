# Secret cloudflared/tunnel-token, filled from the OCI Vault secret "cloudflared-tunnel-token"
# (ClusterSecretStore oci-vault). The Vault secret is a JSON object:
#   {"TUNNEL_TOKEN": "..."}
# TUNNEL_TOKEN: cloudflare-free output tunnel_token
#   (tofu -chdir=infra output -raw tunnel_token).
# Put it in or change it from the laptop (never in the console):
#   ~/oracle-always-free/scripts/put-secret.sh cloudflared-tunnel-token <file.json>
# ESO re-reads it every hour; force it now with
#   kubectl -n cloudflared annotate externalsecret tunnel-token force-sync=$(date +%s) --overwrite
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tunnel-token
  namespace: cloudflared
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-vault
  target:
    name: tunnel-token
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: cloudflared-tunnel-token
