# Secret tailscale/operator-oauth, filled from the OCI Vault secret "tailscale-operator-oauth"
# (ClusterSecretStore oci-vault). The Vault secret is a JSON object:
#   {"client_id": "...", "client_secret": "..."}
# client_id, client_secret: Tailscale admin console -> Settings -> Trust
#   credentials -> the OAuth client of docs/WHAT-YOU-DO.md step 4.4. The chart
#   reads this exact Secret name and these exact keys.
# Put it in or change it from the laptop (never in the console):
#   ~/oracle-always-free/scripts/put-secret.sh tailscale-operator-oauth <file.json>
# ESO re-reads it every hour; force it now with
#   kubectl -n tailscale annotate externalsecret operator-oauth force-sync=$(date +%s) --overwrite
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-vault
  target:
    name: operator-oauth
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: tailscale-operator-oauth
