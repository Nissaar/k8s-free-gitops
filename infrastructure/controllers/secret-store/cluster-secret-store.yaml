# The one place secrets come from: OCI Vault "freetier" (oracle-always-free
# bootstrap), read with the API key of the IAM user cluster-secrets-reader
# (policy: read secrets + secret-bundles of this vault only).
#
# Every ExternalSecret in this repo points here (secretStoreRef.name:
# oci-vault) and reads one Vault secret named <namespace>-<secret> whose
# content is a JSON object of the Secret's keys. Put values in with
#   ~/oracle-always-free/scripts/put-secret.sh <namespace>-<secret> <file.json>
#
# Later, OpenBao becomes a second ClusterSecretStore "openbao"; an app moves
# by changing its secretStoreRef.name. Nothing else changes.
#
# Fields: https://external-secrets.io/latest/provider/oracle-vault/
# (UserPrincipal: auth.user, auth.tenancy, secretRef.privatekey and
# secretRef.fingerprint; a ClusterSecretStore must name their namespace).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: oci-vault
spec:
  provider:
    oracle:
      principalType: UserPrincipal
      vault: ${OCI_VAULT_OCID}
      region: ${OCI_REGION}
      auth:
        user: ${OCI_VAULT_READER_OCID}
        tenancy: ${OCI_TENANCY_OCID}
        secretRef:
          privatekey:
            name: oci-vault-reader
            namespace: external-secrets
            key: privateKey
          fingerprint:
            name: oci-vault-reader
            namespace: external-secrets
            key: fingerprint
