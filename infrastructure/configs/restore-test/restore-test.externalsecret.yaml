# Secret restore-test/restore-test, filled from the OCI Vault secret "restore-test-restore-test"
# (ClusterSecretStore oci-vault). The Vault secret is a JSON object:
#   {"RESTIC_REPOSITORY": "...", "RESTIC_PASSWORD": "...", "AWS_ACCESS_KEY_ID": "...", "AWS_SECRET_ACCESS_KEY": "...", "NTFY_TOKEN": "...", "HEALTHCHECK_URL": "...", "DR_HEALTHCHECK_URL": "..."}
# Used by restore-test (weekly) and dr-drill (monthly).
#   RESTIC_REPOSITORY: s3:<cloudflare-free output r2_s3_endpoint>/backups/restic/home
#   RESTIC_PASSWORD: the password of Home's backup/ service (backup/.env).
#   AWS_*: R2 API token, Object Read only, bucket backups.
#   NTFY_TOKEN: ChatOps ntfy token of user ops.
#   HEALTHCHECK_URL / DR_HEALTHCHECK_URL: healthchecks.io ping URLs, or "".
# Put it in or change it from the laptop (never in the console):
#   ~/oracle-always-free/scripts/put-secret.sh restore-test-restore-test <file.json>
# ESO re-reads it every hour; force it now with
#   kubectl -n restore-test annotate externalsecret restore-test force-sync=$(date +%s) --overwrite
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restore-test
  namespace: restore-test
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-vault
  target:
    name: restore-test
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: restore-test-restore-test
