# Secret previews/preview-smoke, filled from the OCI Vault secret "previews-preview-smoke"
# (ClusterSecretStore oci-vault). The Vault secret is a JSON object:
#   {"CF_ACCESS_CLIENT_ID": "...", "CF_ACCESS_CLIENT_SECRET": "...", "NTFY_TOKEN": "..."}
# Copied into every pr-<n> namespace. CF_ACCESS_*: cloudflare-free outputs
#   ci_smoke_tests_client_id / ci_smoke_tests_client_secret. NTFY_TOKEN: token of
#   the Home ChatOps ntfy user ops (ACL ops:*:rw).
# Put it in or change it from the laptop (never in the console):
#   ~/oracle-always-free/scripts/put-secret.sh previews-preview-smoke <file.json>
# ESO re-reads it every hour; force it now with
#   kubectl -n previews annotate externalsecret preview-smoke force-sync=$(date +%s) --overwrite
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: preview-smoke
  namespace: previews
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-vault
  target:
    name: preview-smoke
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        labels:
          reconcile.fluxcd.io/watch: Enabled
  dataFrom:
    - extract:
        key: previews-preview-smoke
