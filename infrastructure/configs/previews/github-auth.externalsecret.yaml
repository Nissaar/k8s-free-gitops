# Secret previews/github-auth, filled from the OCI Vault secret "previews-github-auth"
# (ClusterSecretStore oci-vault). The Vault secret is a JSON object:
#   {"username": "...", "password": "..."}
# Used by every ResourceSetInputProvider in namespace previews to list pull
#   requests of private repos. password = fine-grained GitHub token (owner
#   <your-github-user>, the app repos that opt in, Metadata: Read, Pull requests: Read);
#   username = any non-empty word, e.g. flux.
# Put it in or change it from the laptop (never in the console):
#   ~/oracle-always-free/scripts/put-secret.sh previews-github-auth <file.json>
# ESO re-reads it every hour; force it now with
#   kubectl -n previews annotate externalsecret github-auth force-sync=$(date +%s) --overwrite
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-auth
  namespace: previews
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-vault
  target:
    name: github-auth
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: previews-github-auth
