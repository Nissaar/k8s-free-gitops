# Every container states CPU/memory requests and limits: two 6 GB nodes leave
# no room for a pod that grows without bound.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-requests-limits
  annotations:
    policies.kyverno.io/title: Require requests and limits
spec:
  validationActions: [Audit] # set for all policies in kustomization.yaml
  failurePolicy: Ignore
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-node-lease, kube-public]
  variables:
    - name: containers
      expression: object.spec.containers + object.spec.?initContainers.orValue([])
  validations:
    - expression: >-
        variables.containers.all(c,
          c.?resources.?requests.?cpu.hasValue() &&
          c.?resources.?requests.?memory.hasValue() &&
          c.?resources.?limits.?cpu.hasValue() &&
          c.?resources.?limits.?memory.hasValue())
      message: every container needs resources.requests and resources.limits for cpu and memory
