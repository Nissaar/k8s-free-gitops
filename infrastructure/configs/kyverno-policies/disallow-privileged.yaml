# No privileged containers. Exceptions are namespaces whose system charts need
# it: kube-system (OKE's flannel/kube-proxy) and tailscale (proxy pods run a
# privileged init container that enables IP forwarding).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-privileged
  annotations:
    policies.kyverno.io/title: Disallow privileged containers
spec:
  validationActions: [Audit] # set for all policies in kustomization.yaml
  failurePolicy: Ignore
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-node-lease, kube-public, tailscale]
  variables:
    - name: containers
      expression: >-
        object.spec.containers
        + object.spec.?initContainers.orValue([])
        + object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.containers.all(c, !c.?securityContext.?privileged.orValue(false))
      message: privileged containers are not allowed here
