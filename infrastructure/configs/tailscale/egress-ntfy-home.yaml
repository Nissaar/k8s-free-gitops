# Egress to the Home ChatOps node (private ntfy, tailnet only).
# The operator starts a small proxy and rewrites externalName to it, so pods
# reach https://<HOME_TAILNET_FQDN>/ through
#   ntfy-home.tailscale.svc.cluster.local:443
# The certificate is for the tailnet name, so scripts call the real name and
# redirect the connection:  curl --connect-to <fqdn>:443:ntfy-home.tailscale.svc.cluster.local:443
apiVersion: v1
kind: Service
metadata:
  name: ntfy-home
  namespace: tailscale
  annotations:
    tailscale.com/tailnet-fqdn: ${HOME_TAILNET_FQDN}
spec:
  type: ExternalName
  externalName: placeholder # replaced by the Tailscale operator
  ports:
    - name: https
      port: 443
      protocol: TCP
