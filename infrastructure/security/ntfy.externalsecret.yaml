# Secret crowdsec/ntfy: the ntfy publisher token (user `bot`) CrowdSec uses to
# post alerts to https://ntfy.<BASE_DOMAIN>, topic `security`. It is the SAME
# bot token the Home CrowdSec and Alertmanager use (ACL bot:*:wo), so it
# also works on the ntfy-standby copy when Home is down.
#
# OCI Vault secret "crowdsec-ntfy":   {"NTFY_TOKEN": "tk_..."}
# Put it in from the laptop (nothing printed):
#   read -rs T; jq -n --arg t "$T" '{NTFY_TOKEN: $t}' \
#     | ~/oracle-always-free/scripts/put-secret.sh crowdsec-ntfy -
# Read by the init container `render-ntfy` of the crowdsec-lapi pod, which
# writes the notification file into an emptyDir (the token is never in a
# ConfigMap, in Helm values or in git). After a change:
#   kubectl -n crowdsec rollout restart deployment/crowdsec-lapi
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy
  namespace: crowdsec
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-vault
  target:
    name: ntfy
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: crowdsec-ntfy
