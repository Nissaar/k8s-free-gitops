# Values that Flux substitutes into manifests as ${NAME} (postBuild).
# Not secret. Fill every <placeholder> BEFORE the first sync: scripts/configure.sh writes BASE_DOMAIN and the optional
# values from cluster.env, oracle-always-free's scripts/make-reader-key.sh writes the OCI_* values, and scripts/preflight.sh
# fails while a required placeholder is left (docs/CONFIGURATION.md, docs/WHAT-YOU-DO.md steps 3 and 19).
#
# Scripts in this repo use $NAME (no braces) so this substitution never
# touches them; script ConfigMaps also carry the substitute: disabled label.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
  namespace: flux-system
data:
  CLUSTER_NAME: oke-free
  CLUSTER_DOMAIN: cluster.local
  BASE_DOMAIN: <your-domain>
  POD_CIDR: 10.244.0.0/16
  OCI_REGION: <your-home-region>
  # OCI Vault read by External Secrets (ClusterSecretStore oci-vault).
  # oracle-always-free scripts/make-reader-key.sh fills these three for you
  # (bootstrap outputs OCI_TENANCY_OCID, OCI_VAULT_OCID,
  # cluster_secrets_reader_ocid). OCIDs are not secret.
  OCI_TENANCY_OCID: ocid1.tenancy.oc1..<tenancy-ocid>
  OCI_VAULT_OCID: ocid1.vault.oc1.<region>.<vault-ocid>
  OCI_VAULT_READER_OCID: ocid1.user.oc1..<reader-user-ocid>
  # Object Storage namespace of the tenancy (oracle-always-free output / OCI console
  # -> Tenancy details -> Object storage namespace).
  OCI_NAMESPACE: <namespace>
  # MagicDNS name of the Home ChatOps node that serves the private ntfy
  # (Tailscale admin console -> Machines -> chatops -> full domain name).
  HOME_TAILNET_FQDN: chatops.<tailnet>.ts.net
  # ChatOps channel that receives cluster results (restore test, previews).
  NTFY_TOPIC: cluster
