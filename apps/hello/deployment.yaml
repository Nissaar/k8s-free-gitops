# traefik/whoami: the end-to-end test app (Cloudflare -> tunnel -> cloudflared
# -> Traefik -> here). It echoes the request, so the headers Traefik passes on
# (X-Forwarded-For = your real IP) are visible at https://hello.example.com
#
# The image line follows :latest by digest: Flux image automation rewrites
# the @sha256 part when the tag moves and commits that to main
# (image-policy.yaml + infrastructure/configs/image-automation).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: hello
  labels:
    app.kubernetes.io/name: hello
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hello
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: whoami
          image: docker.io/traefik/whoami:latest@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44 # {"$imagepolicy": "flux-system:hello"}
          imagePullPolicy: IfNotPresent
          args: ["--port", "8080", "--name", "hello"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
